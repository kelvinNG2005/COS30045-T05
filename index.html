<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Energy Data Visualizations</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" defer></script>
	<script src="load-data.js" defer></script>
	<script src="charts/scatter.js" defer></script>
	<script src="charts/donut.js" defer></script>
	<script src="charts/bar.js" defer></script>
	<script src="charts/line.js" defer></script>
</head>
<body>
	<main class="dashboard">
		<header class="dashboard-header">
			<p class="eyebrow">Energy data</p>
			<h1>Television energy use</h1>
		</header>

		<section class="chart-grid" aria-label="Energy charts">
			<article class="chart-panel">
				<h2>Scatter plot</h2>
				<div id="scatter-plot" class="chart-container"></div>
			</article>
			<article class="chart-panel">
				<h2>Donut chart</h2>
				<div id="donut-chart" class="chart-container"></div>
			</article>
			<article class="chart-panel">
				<h2>Bar chart</h2>
				<div id="bar-chart" class="chart-container"></div>
			</article>
			<article class="chart-panel">
				<h2>Line chart</h2>
				<div id="line-chart" class="chart-container"></div>
			</article>
		</section>
	</main>
</body>
</html>
